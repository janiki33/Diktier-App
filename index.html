<body>
<main class="app">
  <header class="bar">
    <button class="icon-btn" id="openHistory" aria-label="Verlauf">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.25"/><path d="M12 7.5V12l3 2"/></svg>
    </button>
  </header>

  <section class="stage">
    <div class="timer" id="timer" aria-live="off">0:00</div>
    <div class="rec-wrap">
      <canvas id="rings" aria-hidden="true"></canvas>
      <button class="rec" id="rec" aria-label="Aufnahme starten" aria-pressed="false">
        <span class="core"></span>
      </button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>

  <section class="transcript" id="transcript" aria-live="polite">
    <p class="placeholder" id="placeholder">Tippen und sprechen.</p>
    <p class="text"><span id="words"></span><span class="interim" id="interim"></span></p>
    <textarea id="kbd" aria-label="Diktat über die Tastatur"></textarea>
  </section>

  <footer class="actions" id="actions" hidden>
    <button class="pill" id="copy">Kopieren</button>
    <button class="pill" id="share">Teilen</button>
  </footer>
</main>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-label="Verlauf" aria-hidden="true">
  <div class="grabber" id="grabber"><span></span></div>
  <div class="sheet-head">
    <h2>Verlauf</h2>
    <button class="text-btn" id="openSettings">Zugang</button>
  </div>
  <ul class="history" id="history"></ul>
  <p class="empty" id="historyEmpty">Noch keine Diktate.</p>
</aside>

<dialog class="dialog" id="settings">
  <form method="dialog" id="settingsForm">
    <h2>Zugangscode</h2>
    <p>Nur für die Ablage, aus der Claude die Diktate liest. Einmal eingeben, er bleibt auf diesem iPhone.</p>
    <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Code">
    <div class="dialog-actions">
      <button value="cancel" class="text-btn">Abbrechen</button>
      <button value="save" class="text-btn strong" id="saveToken">Sichern</button>
    </div>
  </form>
</dialog>

<label class="haptic" aria-hidden="true"><input type="checkbox" switch id="hapticSwitch" tabindex="-1"></label>
<script type="module" src="/app.js"></script>
</body>
</html>
